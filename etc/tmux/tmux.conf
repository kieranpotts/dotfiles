# ==============================================================================
# tmux config.
#
# https://github.com/tmux/tmux/wiki
# ==============================================================================

# By default, tmux uses `Ctrl-b` as the prefix key. However, many users find it
# awkward. `Ctrl-a` is a common, more accessible, alternative. This snippet
# remaps the prefix key to from 'Ctrl-b' to 'Ctrl-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# The default pane-splitting commands (`"` for vertical and `%` for horizontal)
# can be hard to remember. Use use more intuitive characters, `|` and `-`:
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Use Alt+arrow keys, without the prefix key combination, to switch between panes.
# This is the key combination used in Terminator, a popular Linux terminal
# emulator with built-in multiplexing. You can't therefore use this key
# configuration with Terminator or any other terminal that uses the same keys.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# This setting also allows pane switching using the mouse.
set-option -g mouse-select-pane on

# Start window numbering at 1.
set -g base-index 1

# Highlight the active window with a different background color for the status
# line. The color is taken from the terminal's palette.
set-window-option -g window-status-current-bg yellow

# When you have multiple tmux windows opened, the following settings will
# show a visual notification in the status line when activity is detected in
# another window. The second setting highlights the window with activity.
setw -g monitor-activity on
set -g visual-activity on

# Easily reload the configuration file with `Ctrl-a r`:
bind r source-file ~/.tmux.conf
